plugins:
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 3.4
  NewCops: enable

Style/StringLiterals:
  Enabled: true
  EnforcedStyle: single_quotes

Style/StringLiteralsInInterpolation:
  Enabled: true
  EnforcedStyle: single_quotes

Style/SymbolArray:
  Enabled: false

Layout/LineLength:
  Max: 120

RSpec/NestedGroups:
  AllowedGroups:
    - describe

RSpec/DescribedClass:
  Enabled: false

RSpec/ContextWording:
  Prefixes:
    - when
    - with
    - without
    - that
    - if
    - unless
    - for
